name: AI-LAB-010 offline retrieval baseline

on:
  pull_request:
    paths:
      - "labs/AI-LAB-010/**"
      - ".github/workflows/ai-lab-010-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python3 -m unittest discover -s labs/AI-LAB-010/tests -v
      - name: Synthetic retrieval evaluation
        run: python3 labs/AI-LAB-010/evaluate.py
      - name: Access-control smoke test
        run: |
          python3 labs/AI-LAB-010/rag.py --group RH --question "réclamation virement" > /tmp/rag-result.json
          python3 -c 'import json; r=json.load(open("/tmp/rag-result.json")); assert r["status"] == "no_authorized_evidence" and not r["citations"]'
